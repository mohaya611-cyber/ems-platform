<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Al Hayat EMS">
<meta name="robots" content="noindex, nofollow">
<title>Al Hayat EMS</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--navy:#0b2545;--navy2:#13315c;--blue:#1d8fe1;--blue-d:#1473b8;--teal:#12a3a3;--bg:#eef3f8;--card:#fff;--line:#d9e2ec;--text:#16212e;--muted:#5d6b7c;--ok:#1b9a5a;--warn:#e08a00;--bad:#d64545;--rad:12px;--shadow:0 1px 3px rgba(11,37,69,.12),0 4px 14px rgba(11,37,69,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-d)}
/* header */
.topbar{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img,.brand svg{width:44px;height:44px;border-radius:10px;flex:none;background:#fff;object-fit:contain;padding:2px}
.brand b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;opacity:.8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:#7ee2a8}
.live.off i{background:#ffb4a8}
.who{font-size:13px;text-align:end;line-height:1.2;display:none}
.who small{opacity:.75;display:block}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:15}
.nav-in{display:flex;gap:4px;overflow-x:auto;padding:6px 12px;max-width:1400px;margin:0 auto;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--navy);font-weight:600;white-space:nowrap;min-height:44px}
.nav a:hover{background:#eaf2fb}
.nav a.on{background:var(--navy);color:#fff}
.badge-n{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;min-width:20px;text-align:center}
main{max-width:1400px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;color:var(--navy)}
h2{font-size:18px;margin:0 0 10px;color:var(--navy)}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:#e4ecf5;color:var(--navy)}.btn.sec:hover{background:#d5e1ee}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);min-height:36px;padding:4px 12px}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}
.btn.big{min-height:56px;font-size:18px;width:100%}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px;border-radius:8px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px;color:var(--navy)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1px solid #b8c6d6;border-radius:10px;background:#fff}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(29,143,225,.3);border-color:var(--blue)}
input[readonly]{background:#f1f5f9;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0;font-weight:600}
.chk input{width:22px;height:22px}
/* cards */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--rad);box-shadow:var(--shadow);padding:14px;border-inline-start:5px solid var(--blue)}
.kpi b{display:block;font-size:30px;line-height:1.1;color:var(--navy)}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.c-ok{border-color:var(--ok)}.kpi.c-warn{border-color:var(--warn)}.kpi.c-bad{border-color:var(--bad)}.kpi.c-teal{border-color:var(--teal)}.kpi.c-gray{border-color:#8896a6}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:14px}
.filters label{margin:0 0 3px;font-size:13px}
.filters .btns{display:flex;gap:8px}
.st{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.st-new{background:#fff1d6;color:#8a5a00}.st-received{background:#d9ecff;color:#0e558f}.st-discharged{background:#dff5e8;color:#136b3f}.st-admitted{background:#e8e0fb;color:#4b2f9a}.st-icu{background:#ffe0e0;color:#a12626}.st-deceased{background:#e3e6ea;color:#2b3440}
/* case cards */
.cases{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.case{background:#fff;border-radius:var(--rad);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--blue);cursor:pointer}
.case.s-new{border-color:var(--warn)}.case.s-discharged{border-color:var(--ok)}.case.s-icu{border-color:var(--bad)}.case.s-deceased{border-color:#2b3440}.case.s-admitted{border-color:#6a4ccf}
.case-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.case-h b{font-size:18px;color:var(--navy)}
.case p{margin:0;font-size:15px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a,.thumbs .th{display:block;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f3f6fa;position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .file{display:flex;align-items:center;justify-content:center;height:100%;font-weight:700;color:var(--navy);text-decoration:none;font-size:13px;text-align:center;padding:4px}
.thumbs .rm{position:absolute;top:2px;inset-inline-end:2px;background:rgba(214,69,69,.95);color:#fff;border:0;border-radius:6px;width:26px;height:26px;cursor:pointer}
.case.flash{animation:flash 2s}
@keyframes flash{0%{box-shadow:0 0 0 4px rgba(29,143,225,.7)}100%{box-shadow:var(--shadow)}}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* tables */
.tw{overflow-x:auto;background:#fff;border-radius:var(--rad);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f3f7fb;color:var(--navy);font-size:13px;white-space:nowrap;position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faff}
td.nw{white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0;color:var(--muted)}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hbar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.hbar div.t{background:#e8eef5;border-radius:99px;height:14px;overflow:hidden}
.hbar div.t i{display:block;height:100%;background:var(--blue);border-radius:99px}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 12px;padding-inline-start:22px;font-size:14px}
.tl li:before{content:"";position:absolute;inset-inline-start:4px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.tl li:after{content:"";position:absolute;inset-inline-start:8px;top:16px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
/* modal / toast */
.ovl{position:fixed;inset:0;background:rgba(8,20,38,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:720px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.modal-h h2{margin:0}
.x{border:0;background:#eef3f8;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;color:var(--navy)}
.modal-b{padding:16px 18px 20px}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:15px}
.dl dt{color:var(--muted);font-weight:600;font-size:14px}.dl dd{margin:0;word-break:break-word}
.sbtn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
#toasts{position:fixed;bottom:16px;inset-inline:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:520px;pointer-events:auto}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
.err-msg{color:var(--bad);font-weight:600;margin-top:10px;min-height:1px}
.secret{font-family:Consolas,monospace;font-size:18px;letter-spacing:2px;background:#f1f5f9;padding:10px;border-radius:8px;word-break:break-all;direction:ltr;text-align:left;user-select:all}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy),#17508f 60%,#1d8fe1)}
.login{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login .logo{text-align:center;margin-bottom:10px}
.login .logo img,.login .logo svg{width:110px;height:110px;border-radius:16px;object-fit:contain}
.login h1{text-align:center;margin:6px 0 2px;font-size:22px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 6px;font-size:14px}
#printArea{display:none}
@media (min-width:760px){.who{display:block}.brand b{font-size:19px}.nav{top:60px}}
@media (max-width:560px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}.hbar{grid-template-columns:90px 1fr 34px}.kpi b{font-size:26px}}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:0;color:#000;font-size:11px}
  #printArea h1{font-size:18px}#printArea table{font-size:10px}#printArea th{position:static;background:#e8eef5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea tr{page-break-inside:avoid}
}
.steps{display:flex;align-items:center;gap:0;margin-top:4px}
.steps .s{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:16px}
.steps .s:before{content:"";position:absolute;top:2px;left:0;right:0;height:4px;background:#dbe5ef}
.steps .s:after{content:"";position:absolute;top:-2px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#dbe5ef;border:2px solid #fff}
.steps .s.d{color:var(--navy);font-weight:600}.steps .s.d:before,.steps .s.d:after{background:var(--blue)}
.steps .s:first-child:before{left:50%}.steps .s:last-child:before{right:50%}
.note{background:#fff8e6;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.pill{display:inline-block;background:#e4ecf5;color:var(--navy);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.g{background:#dff5e8;color:#136b3f}.pill.r{background:#ffe0e0;color:#a12626}
.det{font-size:12.5px;color:#34465a;max-width:380px;word-break:break-word}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
.topbar{top:env(safe-area-inset-top,0px)}
.nav{top:calc(env(safe-area-inset-top,0px) + 64px)}
.topbar-in,.nav-in,main,.demo-bar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-bar{background:#fff6dc;border-bottom:1px solid #ecd48a;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:7px;padding-bottom:7px;font-size:13px;color:#5b4300}
.demo-bar .sp{flex:1}
.demo-login{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;color:var(--navy)}
.login-wrap{padding-block:24px}
.hbar span{min-width:0;overflow-wrap:anywhere}
.tw{max-width:100%}
@media (max-width:640px){.topbar{position:static}.nav{top:env(safe-area-inset-top,0px)}.topbar-in{flex-wrap:wrap}.brand{flex-basis:100%}.tools{width:100%;justify-content:flex-end;flex-wrap:wrap}.who{display:block}}

.kpi em{display:block;font-style:normal;font-size:13px;color:var(--blue-d);font-weight:700;margin-top:2px}
.tw table td.num,.tw table th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-in{display:inline-block;height:8px;border-radius:99px;background:var(--blue);vertical-align:middle;margin-inline-start:8px}
.mini{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:12px}

.btn.wa{background:#1fa855;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wa-pre{white-space:pre-wrap;word-break:break-word;background:#f3f6fa;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;font:15px/1.9 inherit;font-family:inherit}
.viewer{position:fixed;inset:0;z-index:120;background:#050c18;display:flex;flex-direction:column;direction:ltr}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top,0px));flex-wrap:wrap}
.vbar .sp{flex:1}.vc{color:#fff;font-weight:700}
.vb{background:#fff;color:#0b2545;border:0;border-radius:10px;min-height:44px;min-width:44px;padding:0 14px;font:700 16px system-ui,sans-serif;cursor:pointer}
.vstage{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.vstage img{margin:auto;display:block;max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.vstage img.z{max-width:none;max-height:none;cursor:zoom-out}
.vl{position:absolute;inset:50% 0 auto;text-align:center;color:#fff;pointer-events:none}
.vnav{display:flex;justify-content:center;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}

.st-cathlab{background:#ffe1ee;color:#9b1f55}.case.s-cathlab{border-color:#d6457f}

</style>
</head>

<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b2545;color:#fff;font:16px system-ui;padding:24px;text-align:center">جاري التحميل…</div></div>
<div id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

function barChart(data, color, lf) {
  const W = 700, H = 230, pl = 30, pb = 36, pt = 14, n = data.length, max = Math.max(4, ...data.map((d) => d.n));

  for (let i = 0; i <= 4; i++) { const y = pt + ch - (ch * i) / 4; s += `<line x1="${pl}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="#e1e8f0"/><text x="${pl - 6}" y="${y + 4}" font-size="11" text-anchor="end" fill="#5d6b7c">${Math.round((max * i) / 4)}</text>`; }
  data.forEach((d, i) => {
    const h = (ch * d.n) / max, x = pl + i * bw + bw * 0.15;
    s += `<rect x="${x}" y="${pt + ch - h}" width="${bw * 0.7}" height="${h}" rx="3" fill="${color}"><title>${esc(d.label)}: ${d.n}</title></rect>`;
    if (d.n) s += `<text x="${x + bw * 0.35}" y="${pt + ch - h - 4}" font-size="11" text-anchor="middle" fill="#16212e">${d.n}</text>`;
    if (i % every === 0 || i === n - 1) s += `<text x="${x + bw * 0.35}" y="${H - 14}" font-size="11" text-anchor="middle" fill="#5d6b7c">${esc(lf ? lf(d.label) : d.label.slice(n === 12 && d.label.length === 7 ? 2 : 5))}</text>`;
  });
  return s + '</svg>';
}

  o.innerHTML = `<div class="vbar"><button class="vb" data-v="close">✕ ${esc(t('close'))}</button><span class="vc"></span><span class="sp"></span><button class="vb" data-v="out" aria-label="${esc(t('v_out'))}">−</button><button class="vb" data-v="in" aria-label="${esc(t('v_in'))}">＋</button><button class="vb" data-v="fit">${esc(t('v_fit'))}</button></div><div class="vstage"><img alt=""><div class="vl">${esc(t('v_loading'))}</div></div><div class="vnav" ${list.length > 1 ? '' : 'hidden'}><button class="vb" data-v="prev">${esc(t('v_prev'))}</button><button class="vb" data-v="next">${esc(t('v_next'))}</button></div>`;
  document.body.appendChild(o);
  const im = o.querySelector('img'), vl = o.querySelector('.vl'), vc = o.querySelector('.vc'), stage = o.querySelector('.vstage');
  const setZ = (n) => { z = Math.max(0, Math.min(5, n)); if (!z) { im.classList.remove('z'); im.style.width = ''; } else { im.classList.add('z'); im.style.width = (100 * Math.pow(1.6, z)).toFixed(0) + '%'; } };
  const show = () => { const a = list[i]; setZ(0); vl.hidden = false; im.dataset.aid = a.id; im.src = window.__att(a.id); vc.textContent = list.length > 1 ? (i + 1) + ' / ' + list.length : ''; if (im.complete && im.naturalWidth > 1) vl.hidden = true; };
  im.onload = () => { vl.hidden = im.naturalWidth > 1; };
  const close = () => { document.removeEventListener('keydown', key, true); o.remove(); };
  const key = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', key, true);
  o.addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return; const a = b.dataset.v;
    if (a === 'close') close(); else if (a === 'in') setZ((z || 0) + 1); else if (a === 'out') setZ(z - 1); else if (a === 'fit') setZ(0);
    else if (a === 'prev') { i = (i + list.length - 1) % list.length; show(); } else if (a === 'next') { i = (i + 1) % list.length; show(); }
  });
  im.onclick = () => setZ(z ? 0 : 2);
  let d0 = 0, z0 = 0; const dist = (t2) => Math.hypot(t2[0].clientX - t2[1].clientX, t2[0].clientY - t2[1].clientY);
  stage.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { d0 = dist(e.touches); z0 = z; } }, { passive: true });
  stage.addEventListener('touchmove', (e) => { if (e.touches.length === 2 && d0) { e.preventDefault(); setZ(Math.round(z0 + Math.log(dist(e.touches) / d0) / Math.log(1.6))); } }, { passive: false });
  stage.addEventListener('touchend', () => { d0 = 0; });
  show();
}

// ───────── case dialog
async function openCase(id) {
  const m = openModal('…'); m.body.innerHTML = `<div class="empty">${esc(t('loading'))}</div>`;
  const st = { id, editing: false, m };
  const load = async () => { try { st.d = await api('GET', '/api/cases/' + id); } catch (e) { closeModal(); toast(errText(e), 'err'); return false; } return true; };
  const draw = () => renderCase(st, load, draw);
  if (await load()) draw();
}
function renderCase(st, load, draw) {
  const { d, m } = st, c = d.case, u = S.user;
  const canStatus = (u.role === 'er' || u.role === 'admin') && !c.archived;
  const canEdit = !c.archived && (u.role === 'admin' || (u.role === 'paramedic' && c.status === 'new'));
  const reload = async () => { if (await load()) draw(); if (S.refresh) S.refresh(); refreshBadge(); };
  m.title.innerHTML = `#${esc(c.case_number)} ${stB(c.status)}`;
  const imgs = d.attachments.filter((a) => a.mime.startsWith('image/') && a.mime !== 'image/heic');
  const atts = d.attachments.map((a) => {
    const img = a.mime.startsWith('image/') && a.mime !== 'image/heic';
    return `<div class="th">${img ? `<img alt="${esc(a.original_name)}" data-aid="${a.id}" src="${window.__att(a.id)}">` : `<span class="file">${esc(a.original_name.slice(0, 14))}</span>`}${canEdit ? `<button class="rm" data-rm="${a.id}" title="${esc(t('remove'))}">×</button>` : ''}</div>`;
  }).join('');
  let h = '';
  if (st.editing) {
    h += `<form id="ef"><label>${esc(t('f_visa'))}</label><select name="visa_type">${opts(VIS, visaL, c.visa_type)}</select>${u.role === 'admin' ? `<label>${esc(t('f_case_number'))}</label><input type="text" name="case_number" maxlength="30" value="${esc(c.case_number)}">` : ''}<label>${esc(t('f_complaint'))}</label><textarea name="chief_complaint" maxlength="500" required>${esc(c.chief_complaint)}</textarea><label>${esc(t('f_notes'))}</label><textarea name="notes" maxlength="2000">${esc(c.notes || '')}</textarea><label>${esc(t('f_pname'))}</label><input type="text" name="patient_name" maxlength="100" autocomplete="off" dir="auto" value="${esc(c.patient_name || '')}"><label>${esc(t('f_pid'))}</label><input type="text" name="patient_id" maxlength="30" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" dir="auto" value="${esc(c.patient_id || '')}"><div class="err-msg" id="ee"></div><div class="row" style="margin-top:10px"><button class="btn">${esc(t('save'))}</button><button type="button" class="btn sec" id="ec">${esc(t('cancel'))}</button></div></form>`;
  } else {
    h += `<dl class="dl"><dt>${esc(t('f_complaint'))}</dt><dd>${esc(c.chief_complaint)}</dd><dt>${esc(t('f_visa'))}</dt><dd>${esc(visaL(c.visa_type))}</dd>${c.patient_name ? `<dt>${esc(t('f_pname'))}</dt><dd dir="auto">${esc(c.patient_name)}</dd>` : ''}${c.patient_id ? `<dt>${esc(t('f_pid'))}</dt><dd dir="auto">${esc(c.patient_id)}</dd>` : ''}<dt>${esc(t('f_paramedic'))}</dt><dd>${esc(c.paramedic_name)}</dd><dt>${esc(t('f_created'))}</dt><dd>${esc(fmtDT(c.created_at))}</dd>${c.notes ? `<dt>${esc(t('f_notes'))}</dt><dd>${esc(c.notes).replace(/\n/g, '<br>')}</dd>` : ''}${c.arrived_at ? `<dt>${esc(t('f_arrival'))}</dt><dd>${esc(fmtDT(c.arrived_at))}</dd>` : ''}${c.status_updated_at ? `<dt>${esc(t('f_updated'))}</dt><dd>${esc(fmtDT(c.status_updated_at))} · ${esc(c.status_updated_by || '')}</dd>` : ''}${c.archived ? `<dt>${esc(t('f_archived_at'))}</dt><dd>${esc(fmtDT(c.archived_at))} · ${esc(c.archived_by || '')}</dd>` : ''}</dl>`;
  }
  h += `<h2 style="margin-top:18px">${esc(t('f_attachments'))}</h2><div class="thumbs">${atts || `<span class="hint">${esc(t('none'))}</span>`}</div>${imgs.length ? `<div class="row" style="margin-top:10px">${imgs.map((a, k) => `<button type="button" class="btn" data-view="${k}">🖼 ${esc(t('view_img'))}${imgs.length > 1 ? ' ' + (k + 1) : ''}</button>`).join('')}</div>` : ''}`;
  if (canEdit) h += `<div style="margin-top:8px"><label class="btn sec sm" style="display:inline-flex;margin:0;cursor:pointer">+ ${esc(t('add_doc'))}<input type="file" id="addf" accept="image/*" multiple hidden></label></div>`;
  if (canStatus) {
    h += `<h2 style="margin-top:18px">${esc(t('f_status'))}</h2><label>${esc(t('f_arrival'))}</label><input type="datetime-local" id="arr"><div class="hint">${esc(t('f_arrival_hint'))}</div><div class="sbtn">${['received', 'admitted', 'icu', 'cathlab', 'discharged', 'deceased'].filter((s) => s !== c.status).map((s) => `<button class="btn ${s === 'discharged' ? 'ok' : s === 'deceased' ? 'bad' : s === 'icu' ? 'warn' : s === 'cathlab' ? 'sec' : ''}" data-ss="${s}">${esc(t('st_' + s))}</button>`).join('')}</div><div class="err-msg" id="se"></div>`;
  }
  h += `<h2 style="margin-top:18px">${esc(t('f_timeline'))}</h2><ul class="tl">${d.timeline.map((x) => `<li>${stB(x.status)} <small>${esc(fmtDT(x.at))} · ${esc(t('f_by'))} ${esc(x.by)}</small></li>`).join('')}</ul>`;
  const act = [];
  if (canEdit && !st.editing) act.push(`<button class="btn sec" id="eb">✎ ${esc(t('edit'))}</button>`);
  if (u.role === 'admin' && !c.archived && ['discharged', 'deceased'].includes(c.status)) act.push(`<button class="btn sec" id="ab">🗄 ${esc(t('archive'))}</button>`);
  if (u.role === 'admin' && c.archived) act.push(`<button class="btn sec" id="ub">↩ ${esc(t('unarchive'))}</button>`);
  if (imgs.length) act.unshift(imgShareBtn());
  act.unshift(waBtn(c));
  if (act.length) h += `<div class="row" style="margin-top:14px">${act.join('')}</div>`;
  if (d.history) h += `<h2 style="margin-top:18px">${esc(t('f_history'))}</h2><div class="tw"><table><tbody>${d.history.map((x) => `<tr><td class="nw">${esc(fmtDT(x.ts))}</td><td>${esc(x.user)}</td><td>${esc(actLabel(x.action))}</td><td class="det">${auditDetails({ action: x.action, details: x.details })}</td></tr>`).join('')}</tbody></table></div>`;
  m.body.innerHTML = h;
  const B = m.body, fail = (id, e) => { const el = $('#' + id, B); if (el) el.textContent = errText(e); else toast(errText(e), 'err'); };
  $$('[data-view]', B).forEach((b) => { b.onclick = () => viewer(imgs, +b.dataset.view); });
  $$('.th img[data-aid]', B).forEach((im) => { im.style.cursor = 'zoom-in'; im.onclick = () => viewer(imgs, imgs.findIndex((a) => String(a.id) === im.dataset.aid)); });
  wireImgShare(B, c, imgs);
  const eb = $('#eb', B); if (eb) eb.onclick = () => { st.editing = true; draw(); };
  const ec = $('#ec', B); if (ec) ec.onclick = () => { st.editing = false; draw(); };
  const ef = $('#ef', B);
  if (ef) ef.onsubmit = async (e) => { e.preventDefault(); const f = e.target; const body = { visa_type: f.visa_type.value, chief_complaint: f.chief_complaint.value, notes: f.notes.value, patient_name: f.patient_name.value, patient_id: f.patient_id.value }; if (f.case_number) body.case_number = f.case_number.value; try { await api('PATCH', '/api/cases/' + c.id, body); toast(t('case_updated'), 'ok'); st.editing = false; reload(); } catch (er) { fail('ee', er); } };
  $$('[data-rm]', B).forEach((b) => { b.onclick = async (e) => { e.preventDefault(); e.stopPropagation(); if (!(await askConfirm(t('confirm_delete_att')))) return; try { await api('DELETE', '/api/attachments/' + b.dataset.rm); reload(); } catch (er) { fail('ee', er); } }; });
  const addf = $('#addf', B);
  if (addf) addf.onchange = async () => { const fd = new FormData(); for (const f of addf.files) fd.append('files', f, f.name); try { await api('POST', `/api/cases/${c.id}/attachments`, fd); reload(); } catch (er) { toast(errText(er), 'err'); } };
  $$('[data-ss]', B).forEach((b) => { b.onclick = async () => {
    const s = b.dataset.ss; if (s === 'deceased' && !(await askConfirm(t('confirm_deceased')))) return;
    const arr = $('#arr', B).value; const body = { status: s }; if (arr) body.arrived_at = new Date(arr).toISOString();
    try { await api('POST', `/api/cases/${c.id}/status`, body); toast(t('status_updated'), 'ok'); reload(); } catch (er) { fail('se', er); }
  }; });
  const ab = $('#ab', B); if (ab) ab.onclick = async () => { if (!(await askConfirm(t('confirm_archive')))) return; try { await api('POST', `/api/cases/${c.id}/archive`); toast(t('archived_ok'), 'ok'); closeModal(); if (S.refresh) S.refresh(); } catch (er) { toast(errText(er), 'err'); } };
  const ub = $('#ub', B); if (ub) ub.onclick = async () => { try { await api('POST', `/api/cases/${c.id}/unarchive`); toast(t('unarchived_ok'), 'ok'); closeModal(); if (S.refresh) S.refresh(); } catch (er) { toast(errText(er), 'err'); } };
}

// ───────── user dialogs (admin)
function userForm(u) {
  const m = openModal(esc(u ? t('edit') : t('u_add')));
  m.body.innerHTML = `<form id="uf"><label>${esc(t('u_name'))}</label><input type="text" name="name" required maxlength="100" value="${esc(u ? u.name : '')}">${u ? '' : `<label>${esc(t('email'))}</label><input type="email" name="email" required>`}<label>${esc(t('u_role'))}</label><select name="role">${opts(['paramedic', 'er', 'admin'], (r) => t('role_' + r), u ? u.role : 'paramedic')}</select><label class="chk"><input type="checkbox" name="mfa_required" ${u && u.mfa_required ? 'checked' : ''}> ${esc(t('u_mfa_req'))}</label>${u ? '' : `<label>${esc(t('password'))} (${esc(t('f_auto'))})</label><input type="text" name="password" autocomplete="off" placeholder="—">`}<div class="err-msg" id="uerr"></div><button class="btn" style="margin-top:8px">${esc(t('save'))}</button></form>`;
  $('#uf').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target; const body = { name: f.name.value, role: f.role.value, mfa_required: f.mfa_required.checked };
    try {
      if (u) { await api('PATCH', '/api/users/' + u.id, body); closeModal(); }
      else { body.email = f.email.value; if (f.password.value) body.password = f.password.value; const r = await api('POST', '/api/users', body); tempPw(r.temp_password, r.user.email); }
      S.usersReload && S.usersReload(); S.paramedics = null;
    } catch (er) { $('#uerr').textContent = errText(er); }
  };
}
function tempPw(pw, email) { const m = openModal(esc(email)); m.body.innerHTML = `<p>${esc(t('u_temp'))}</p><div class="secret">${esc(pw)}</div><button class="btn" style="margin-top:12px" data-act="closeModal">${esc(t('close'))}</button>`; }

// ───────── global actions
const ACT = {
  exportXlsx: async (el) => {
    const kind = el.dataset.kind, f = { ...(S.f[kind === 'report' ? 'reports' : kind] || {}) };
    if (kind === 'archive') f.archived = '1'; else if (kind === 'cases') f.archived = '0';
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (!dl) return toast(t('x_unavail'), 'err');
      el.disabled = true;
      const d = await api('GET', '/api/report?' + qs(f));
      await dl.save({ filename: `EMS-${kind}-${new Date().toISOString().slice(0, 10)}.xlsx`, data: buildXlsx(xlsxSheets(d.stats, d.items, kind)) });
      toast(t('x_saved'), 'ok');
    } catch (e) { if (e && e.code === 'declined') toast(t('x_declined')); else toast(e && e.status ? errText(e) : t('x_unavail'), 'err'); }
    finally { el.disabled = false; }
  },
  archiveAll: async () => {
    if (!(await askConfirm(t('confirm_arch_all')))) return;
    try { const r = await api('POST', '/api/archive/run', { all: true }); toast(`${r.archived} ${t('arch_done')}`, 'ok'); if (S.refresh) S.refresh(); } catch (e) { toast(errText(e), 'err'); }
  },

  forgot: async () => { const em = ($('#em') || {}).value; if (!em || !em.trim()) { $('#le').textContent = t('forgot_need'); return; } try { await api('POST', '/api/forgot', { email: em.trim() }); toast(t('forgot_sent'), 'ok'); } catch (e) { toast(errText(e), 'err'); } },
  closeModal: () => closeModal(),
  lang: () => { S.lang = S.lang === 'ar' ? 'en' : 'ar'; localStorage.setItem('lang', S.lang); if (!S.user) showLogin(); else if (S.user.blocked) showSetup(); else { renderShell(); connectEvents(); route(); } },
  logout: async () => { try { await api('POST', '/api/logout'); } catch (_) {} S.user = null; stopEvents(); showLogin(); },
  security: () => { const m = openModal(esc(t('security'))); m.body.dataset.full = '1'; securityPanel(m.body, async () => { const r = await api('GET', '/api/me'); S.user = r.user; securityPanel(m.body, null); }); },
  qs: async (el) => {
    const st = el.dataset.st; if (st === 'deceased' && !(await askConfirm(t('confirm_deceased')))) return;
    el.disabled = true;
    try { await api('POST', `/api/cases/${el.dataset.id}/status`, { status: st }); toast(t('status_updated'), 'ok'); if (S.refresh) S.refresh(); refreshBadge(); } catch (e) { toast(errText(e), 'err'); el.disabled = false; }
  },
  printReport: () => printReport().catch((e) => toast(errText(e), 'err')),
  addUser: () => userForm(null),
  editUser: (el) => userForm((S.usersCache || []).find((x) => x.id === +el.dataset.id)),
  toggleUser: async (el) => { try { await api('PATCH', '/api/users/' + el.dataset.id, { active: el.dataset.on !== '1' }); S.usersReload(); S.paramedics = null; } catch (e) { toast(errText(e), 'err'); } },
  resetPw: async (el) => { try { const r = await api('POST', `/api/users/${el.dataset.id}/reset-password`); const u = (S.usersCache || []).find((x) => x.id === +el.dataset.id); toast(t('reset_sent'), 'ok'); } catch (e) { toast(errText(e), 'err'); } },
  resetMfa: async (el) => { try { await api('POST', `/api/users/${el.dataset.id}/reset-mfa`); toast('OK', 'ok'); S.usersReload(); } catch (e) { toast(errText(e), 'err'); } },
  runArchive: async () => { try { const r = await api('POST', '/api/archive/run'); toast(`${r.archived} ${t('s_ran')}`, 'ok'); } catch (e) { toast(errText(e), 'err'); } },
};
document.addEventListener('click', async (e) => {
  const nv = e.target.closest('[data-nav]');
  if (nv) { e.preventDefault(); S.view0 = nv.dataset.nav; route(); return; }
  const a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); e.stopPropagation(); if (ACT[a.dataset.act]) await ACT[a.dataset.act](a); return; }
  const pg = e.target.closest('[data-pg]');
  if (pg) { const [k, dir] = pg.dataset.pg.split(':'); S.p[k] = Math.max(0, (S.p[k] || 0) + (+dir) * (k === 'audit' ? 50 : 30)); if (S.refresh) S.refresh(); return; }
  const o = e.target.closest('[data-open]');
  if (o && !e.target.closest('a,button,input,select')) openCase(+o.dataset.open);
});

window.addEventListener('ems-dberr',()=>toast(t('err_db'),'err'));
// ───────── boot
(async function boot() {
  applyLang();
  try { const r = await api('GET', '/api/me'); S.user = r.user; } catch (_) { S.user = null; }
  start();
})();
})();

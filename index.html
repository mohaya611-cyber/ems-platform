<style>
:root{--navy:#0b2545;--navy2:#13315c;--blue:#1d8fe1;--blue-d:#1473b8;--teal:#12a3a3;--bg:#eef3f8;--card:#fff;--line:#d9e2ec;--text:#16212e;--muted:#5d6b7c;--ok:#1b9a5a;--warn:#e08a00;--bad:#d64545;--rad:12px;--shadow:0 1px 3px rgba(11,37,69,.12),0 4px 14px rgba(11,37,69,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-d)}
/* header */
.topbar{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img,.brand svg{width:44px;height:44px;border-radius:10px;flex:none;background:#fff;object-fit:contain;padding:2px}
.brand b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;opacity:.8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:#7ee2a8}
.live.off i{background:#ffb4a8}
.who{font-size:13px;text-align:end;line-height:1.2;display:none}
.who small{opacity:.75;display:block}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:15}
.nav-in{display:flex;gap:4px;overflow-x:auto;padding:6px 12px;max-width:1400px;margin:0 auto;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--navy);font-weight:600;white-space:nowrap;min-height:44px}
.nav a:hover{background:#eaf2fb}
.nav a.on{background:var(--navy);color:#fff}
.badge-n{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;min-width:20px;text-align:center}
main{max-width:1400px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;color:var(--navy)}
h2{font-size:18px;margin:0 0 10px;color:var(--navy)}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:#e4ecf5;color:var(--navy)}.btn.sec:hover{background:#d5e1ee}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);min-height:36px;padding:4px 12px}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}
.btn.big{min-height:56px;font-size:18px;width:100%}
.btn.sm{min-height:34px;padding:4px 12px;font-size:14px;border-radius:8px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px;color:var(--navy)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1px solid #b8c6d6;border-radius:10px;background:#fff}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(29,143,225,.3);border-color:var(--blue)}
input[readonly]{background:#f1f5f9;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0;font-weight:600}
.chk input{width:22px;height:22px}
/* cards */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.kpi{background:#fff;border-radius:var(--rad);box-shadow:var(--shadow);padding:14px;border-inline-start:5px solid var(--blue)}
.kpi b{display:block;font-size:30px;line-height:1.1;color:var(--navy)}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.c-ok{border-color:var(--ok)}.kpi.c-warn{border-color:var(--warn)}.kpi.c-bad{border-color:var(--bad)}.kpi.c-teal{border-color:var(--teal)}.kpi.c-gray{border-color:#8896a6}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:14px}
.filters label{margin:0 0 3px;font-size:13px}
.filters .btns{display:flex;gap:8px}
.st{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.st-new{background:#fff1d6;color:#8a5a00}.st-received{background:#d9ecff;color:#0e558f}.st-discharged{background:#dff5e8;color:#136b3f}.st-admitted{background:#e8e0fb;color:#4b2f9a}.st-icu{background:#ffe0e0;color:#a12626}.st-deceased{background:#e3e6ea;color:#2b3440}
/* case cards */
.cases{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.case{background:#fff;border-radius:var(--rad);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--blue);cursor:pointer}
.case.s-new{border-color:var(--warn)}.case.s-discharged{border-color:var(--ok)}.case.s-icu{border-color:var(--bad)}.case.s-deceased{border-color:#2b3440}.case.s-admitted{border-color:#6a4ccf}
.case-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.case-h b{font-size:18px;color:var(--navy)}
.case p{margin:0;font-size:15px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a,.thumbs .th{display:block;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f3f6fa;position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .file{display:flex;align-items:center;justify-content:center;height:100%;font-weight:700;color:var(--navy);text-decoration:none;font-size:13px;text-align:center;padding:4px}
.thumbs .rm{position:absolute;top:2px;inset-inline-end:2px;background:rgba(214,69,69,.95);color:#fff;border:0;border-radius:6px;width:26px;height:26px;cursor:pointer}
.case.flash{animation:flash 2s}
@keyframes flash{0%{box-shadow:0 0 0 4px rgba(29,143,225,.7)}100%{box-shadow:var(--shadow)}}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* tables */
.tw{overflow-x:auto;background:#fff;border-radius:var(--rad);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f3f7fb;color:var(--navy);font-size:13px;white-space:nowrap;position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faff}
td.nw{white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0;color:var(--muted)}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hbar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.hbar div.t{background:#e8eef5;border-radius:99px;height:14px;overflow:hidden}
.hbar div.t i{display:block;height:100%;background:var(--blue);border-radius:99px}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 12px;padding-inline-start:22px;font-size:14px}
.tl li:before{content:"";position:absolute;inset-inline-start:4px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.tl li:after{content:"";position:absolute;inset-inline-start:8px;top:16px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
/* modal / toast */
.ovl{position:fixed;inset:0;background:rgba(8,20,38,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:720px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.modal-h h2{margin:0}
.x{border:0;background:#eef3f8;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;color:var(--navy)}
.modal-b{padding:16px 18px 20px}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:15px}
.dl dt{color:var(--muted);font-weight:600;font-size:14px}.dl dd{margin:0;word-break:break-word}
.sbtn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
#toasts{position:fixed;bottom:16px;inset-inline:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:520px;pointer-events:auto}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
.err-msg{color:var(--bad);font-weight:600;margin-top:10px;min-height:1px}
.secret{font-family:Consolas,monospace;font-size:18px;letter-spacing:2px;background:#f1f5f9;padding:10px;border-radius:8px;word-break:break-all;direction:ltr;text-align:left;user-select:all}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy),#17508f 60%,#1d8fe1)}
.login{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login .logo{text-align:center;margin-bottom:10px}
.login .logo img,.login .logo svg{width:110px;height:110px;border-radius:16px;object-fit:contain}
.login h1{text-align:center;margin:6px 0 2px;font-size:22px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 6px;font-size:14px}
#printArea{display:none}
@media (min-width:760px){.who{display:block}.brand b{font-size:19px}.nav{top:60px}}
@media (max-width:560px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}.hbar{grid-template-columns:90px 1fr 34px}.kpi b{font-size:26px}}

  body{background:#fff}

  #printArea{display:block!important;padding:0;color:#000;font-size:11px}
  #printArea h1{font-size:18px}#printArea table{font-size:10px}#printArea th{position:static;background:#e8eef5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea tr{page-break-inside:avoid}
}
.steps{display:flex;align-items:center;gap:0;margin-top:4px}
.steps .s{flex:1;text-align:center;font-size:12px;color:var(--muted);position:relative;padding-top:16px}
.steps .s:before{content:"";position:absolute;top:2px;left:0;right:0;height:4px;background:#dbe5ef}

.steps .s.d{color:var(--navy);font-weight:600}.steps .s.d:before,.steps .s.d:after{background:var(--blue)}
.steps .s:first-child:before{left:50%}.steps .s:last-child:before{right:50%}
.note{background:#fff8e6;border:1px solid #f1d58a;border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.pill{display:inline-block;background:#e4ecf5;color:var(--navy);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.g{background:#dff5e8;color:#136b3f}.pill.r{background:#ffe0e0;color:#a12626}
.det{font-size:12.5px;color:#34465a;max-width:380px;word-break:break-word}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
.topbar{top:env(safe-area-inset-top,0px)}

.topbar-in,.nav-in,main,.demo-bar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.tw{max-width:100%}

.btn.wa{background:#1fa855;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wa-pre{white-space:pre-wrap;word-break:break-word;background:#f3f6fa;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;font:15px/1.9 inherit;font-family:inherit}

.vbar .sp{flex:1}.vc{color:#fff;font-weight:700}
.vb{background:#fff;color:#0b2545;border:0;border-radius:10px;min-height:44px;min-width:44px;padding:0 14px;font:700 16px system-ui,sans-serif;cursor:pointer}

.st-cathlab{background:#ffe1ee;color:#9b1f55}.case.s-cathlab{border-color:#d6457f}

.case.s-golf{border-color:#1e9e5a}.case.s-golf_handed{border-color:var(--warn)}.case.s-golf_recv{border-color:#1d8fe1}.case.s-golf_done{border-color:#7a8699}

<body>
<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b2545;color:#fff;font:16px system-ui;padding:24px;text-align:center">جاري التحميل…</div></div>

async function api(method, url, body) {
  const opt = { method, headers: { 'X-Requested-With': 'ems' }, credentials: 'same-origin' };
  if (body instanceof FormData) opt.body = body; else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r; try { r = await fetch(url, opt); } catch (_) { throw { code: 'network' }; }
  const data = (r.headers.get('content-type') || '').includes('json') ? await r.json() : null;
  if (!r.ok) {
    const code = (data && data.error) || 'server_error';
    if (r.status === 401 && S.user && url !== '/api/login') { S.user = null; stopEvents(); closeModal(); showLogin(); toast(t('err_unauthenticated'), 'err'); }
    throw { code, status: r.status };
  }
  return data;
}

function connectEvents() {
  stopEvents();

  const live = (on) => { const el = $('#live'); if (el) { el.classList.toggle('off', !on); $('span', el).textContent = on ? t('live') : t('offline'); } };
  es.onopen = () => live(true); es.onerror = () => live(false);

    if (S.user.role === 'er' && d.type === 'created' && d.status === 'new') { toast(`${t('new_incoming')} #${d.case_number}`, 'ok'); beep(); }

function barChart(data, color, lf) {
  const W = 700, H = 230, pl = 30, pb = 36, pt = 14, n = data.length, max = Math.max(4, ...data.map((d) => d.n));
  const bw = (W - pl - 8) / n, ch = H - pb - pt, every = Math.ceil(n / 10);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let i = 0; i <= 4; i++) { const y = pt + ch - (ch * i) / 4; s += `<line x1="${pl}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="#e1e8f0"/><text x="${pl - 6}" y="${y + 4}" font-size="11" text-anchor="end" fill="#5d6b7c">${Math.round((max * i) / 4)}</text>`; }
  data.forEach((d, i) => {
    const h = (ch * d.n) / max, x = pl + i * bw + bw * 0.15;
    s += `<rect x="${x}" y="${pt + ch - h}" width="${bw * 0.7}" height="${h}" rx="3" fill="${color}"><title>${esc(d.label)}: ${d.n}</title></rect>`;
    if (d.n) s += `<text x="${x + bw * 0.35}" y="${pt + ch - h - 4}" font-size="11" text-anchor="middle" fill="#16212e">${d.n}</text>`;
    if (i % every === 0 || i === n - 1) s += `<text x="${x + bw * 0.35}" y="${H - 14}" font-size="11" text-anchor="middle" fill="#5d6b7c">${esc(lf ? lf(d.label) : d.label.slice(n === 12 && d.label.length === 7 ? 2 : 5))}</text>`;
  });
  return s + '</svg>';

function golfSheets(d) {

  const sum = [[t('m_metric'), t('c_count'), t('c_pct')]];
  [['gk_total', k.total], ['gk_ambulance', k.ambulance], ['gk_clinic', k.clinic], ['gk_other', k.other], ['gk_reached', k.reached], ['gk_waiting', k.waiting], ['gk_awaiting', k.awaiting]].forEach(([key, n]) => sum.push([t(key), n, P(n)]));
  sum.push(['', '', ''], [t('g_t_handover'), '', ''], [t('t_avg') + ' (' + t('unit_min') + ')', tm.handover.avg, ''], [t('t_median') + ' (' + t('unit_min') + ')', tm.handover.median, ''], [t('t_max') + ' (' + t('unit_min') + ')', tm.handover.max, ''],
    [t('g_t_receive'), '', ''], [t('t_avg') + ' (' + t('unit_min') + ')', tm.receive.avg, ''], [t('t_median') + ' (' + t('unit_min') + ')', tm.receive.median, ''], [t('t_max') + ' (' + t('unit_min') + ')', tm.receive.max, '']);
  const st = [[t('g_staff'), t('c_count'), t('gd_ambulance'), t('gd_clinic'), t('gd_other'), t('gk_reached'), t('t_avg') + ' – ' + t('g_t_handover') + ' (' + t('unit_min') + ')']];
  d.stats.staff.forEach((p) => st.push([p.name, p.total, p.ambulance, p.clinic, p.other, p.reached, p.avg_handover]));
  const cs = [[t('f_case_number'), t('g_staff'), t('g_dest'), t('g_at'), t('g_handed_at'), t('g_recv_by'), t('g_recv_at'), t('x_min_receipt'), t('g_stage'), t('f_arrival'), t('f_pname')]];
  d.items.forEach((c) => cs.push([c.case_number, c.golf_name || '', gDestFull(c), fmtDT(c.golf_at), c.golf_handed_at ? fmtDT(c.golf_handed_at) : '', c.golf_recv_by || '', c.golf_recv_at ? fmtDT(c.golf_recv_at) : '', c.golf_handed_at ? mins(c.golf_at, c.golf_handed_at) : '', t('st_' + c.status), c.arrived_at ? fmtDT(c.arrived_at) : '', c.patient_name || '']));
  const hr = [[t('c_name'), t('c_count'), t('c_pct')]]; d.stats.hour.forEach((n, i) => hr.push([String(i).padStart(2, '0') + ':00', n, P(n)]));
  return [{ name: t('sh_golf_sum'), rows: sum, widths: [40, 12, 12] }, { name: t('sh_golf_staff'), rows: st, widths: [26, 10, 16, 16, 18, 18, 30] }, { name: t('sh_golf_cases'), rows: cs, widths: [16, 22, 26, 17, 17, 22, 17, 14, 26, 17, 24] }, { name: t('sh_hour'), rows: hr, widths: [14, 10, 10] }];
}

  function calc(items) {
    const rs = new Set(), r = { carts: 0, total: 0, src: { haram: 0, quba: 0, clinic: 0, other: 0 }, nosrc: 0, icu: 0, picu: 0, ward: 0, cath: 0, adm: 0, asrc: {} };
    [...SK, 'other'].forEach((k) => { r.asrc[k] = { icu: 0, picu: 0, ward: 0, cath: 0, n: 0 }; });
    for (const c of items) {
      r.total++; rs.add(c.report_no || c.case_number);
      const k = eff(c), KK = SK.includes(k) || k === 'other';
      if (c.source === 'carts') r.carts++;
      if (KK) r.src[k]++; else r.nosrc++;

    r.reports = rs.size;

  const css = `.cn{width:810px;box-sizing:border-box;background:#eef2f8;color:#14233c;font-family:-apple-system,"SF Pro Text","SF Arabic","Geeza Pro","Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:26px;overflow:hidden}
.cn *{box-sizing:border-box}
.cn-n{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cn-h{height:215px;padding:26px 34px 26px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(115deg,#0a5ab0 0%,#12407f 52%,#5e2d52 100%)}

.cn-kc b{display:block;font-size:42px;line-height:1.1;font-weight:800}

.cn-tb{width:100%;border-collapse:collapse;font-size:14px}
.cn-tb th{background:#eef3fb;color:#0b5cab;font-weight:800;padding:11px 8px;text-align:center}
.cn-tb td{padding:12px 8px;text-align:center;border-bottom:1px solid #edf0f5;font-weight:600}
.cn-tb th:first-child,.cn-tb td:first-child{text-align:start}
.cn-tb td:first-child{font-weight:700}
.cn-foot{text-align:center;color:#8a95a6;font-size:12px;margin-top:22px}
.cn-up{color:#d9232e}.cn-dnn{color:#1e9e5a}.cn-eq{color:#7a8699}`;

  function seg(vals, cols) {
    const R = 70, C = 2 * Math.PI * R, tot = vals.reduce((a, b) => a + b, 0) || 1;
    let off = 0, s = `<svg xmlns="http://www.w3.org/2000/svg" width="190" height="190" viewBox="0 0 190 190"><g transform="rotate(-90 95 95)">`;
    vals.forEach((v, i) => { if (!v) return; const len = C * v / tot; s += `<circle cx="95" cy="95" r="${R}" fill="none" stroke="${cols[i]}" stroke-width="32" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; });
    return 'data:image/svg+xml;base64,' + btoa(s + '</g></svg>');
  }

  function pageHtml(lang, D) {
    const ar = lang === 'ar', c = D.cur, dir = ar ? 'rtl' : 'ltr', mon = D.kind === 'month';
    const sn = SN[lang], ss = SS[lang];
    const T = ar ? {
      ttl: mon ? 'الإحصائية الشهرية لنقل الحالات' : 'الإحصائية اليومية لنقل الحالات',
      sub: `<span class="cn-n">${mon ? 'Monthly' : 'Daily'} Census</span> · قسم طب الطوارئ – EMS`,
      tot: 'إجمالي النقل', cases: 'حالات', adm: 'حالات التنويم', rate: 'نسبة التنويم', icu: 'عناية مركزة', ward: 'أجنحة', wardS: 'Ward',
      bysrc: 'توزيع الحالات حسب الجهة', noadm: 'لا يوجد تنويم', admW: 'تنويم', nosrc: 'حالة بدون جهة محددة',
      out: 'نتيجة الحالات المنقولة', oIcu: 'عناية مركزة ICU', oPicu: 'عناية أطفال PICU', oWard: 'أجنحة Ward', oCath: 'كاث لاب Cath Lab', oNo: 'بدون تنويم',
      adms: 'مصدر حالات التنويم', src: 'الجهة', sum: 'المجموع', noAdm: 'لا توجد حالات تنويم', cs: 'حالات', arate: (n) => `نسبة التنويم من حالات ${n}`,
      cmp: 'مقارنة بمتوسط شهر ' + MN.ar[D.pm - 1], metric: 'المؤشر', diff: 'الفرق', avg: 'متوسط ' + MN.ar[D.pm - 1] + ' اليومي',
      now: mon ? 'متوسط ' + MN.ar[D.m - 1] + ' اليومي' : 'اليوم ' + pad(D.d) + '/' + pad(D.m),
      mTot: 'إجمالي النقل', mAdm: 'التنويم', mIcu: 'العناية المركزة (مع PICU)', mRate: 'نسبة التنويم',
      foot: 'مستشفى الحياة الوطني · قسم طب الطوارئ · بالتعاون مع هيئة الهلال الأحمر السعودي', wk: 'الأيام المحسوبة'
    } : {
      ttl: mon ? 'Monthly Patient Transfer Census' : 'Daily Patient Transfer Census',
      sub: 'Emergency Medicine Department – EMS',
      tot: 'Total Transfers', cases: 'cases', adm: 'Admissions', rate: 'Admission rate', icu: 'Intensive Care', ward: 'Ward', wardS: 'general ward',
      bysrc: 'Transfers by Source', noadm: 'no admissions', admW: 'admitted', nosrc: 'case(s) with no source specified',
      out: 'Transfer Outcomes', oIcu: 'ICU', oPicu: 'PICU', oWard: 'Ward', oCath: 'Cath Lab', oNo: 'Not admitted',
      adms: 'Admissions by Source', src: 'Source', sum: 'Total', noAdm: 'No admissions', cs: 'cases', arate: (n) => `${n} admission rate`,
      cmp: 'Comparison with ' + MN.en[D.pm - 1] + ' Daily Average', metric: 'Metric', diff: 'Difference', avg: MN.en[D.pm - 1] + ' daily avg',
      now: mon ? MN.en[D.m - 1] + ' daily avg' : 'Today ' + pad(D.d) + '/' + pad(D.m),
      mTot: 'Total transfers', mAdm: 'Admissions', mIcu: 'Intensive care (incl. PICU)', mRate: 'Admission rate',
      foot: 'Al Hayat National Hospital · Emergency Medicine Department · in partnership with the Saudi Red Crescent Authority', wk: 'Days counted'
    };
    const pc = (n) => (c.total ? f1(n * 100 / c.total) : '0.0') + '%';
    const pill = mon ? `<small>${MN[lang][D.m - 1]}</small><b>${L(pad(D.m) + '/' + D.y)}</b>` : `<small>${WDN[lang][D.wd]}</small><b>${L(pad(D.d) + '/' + pad(D.m) + '/' + D.y)}</b>`;
    let h = `<div class="cn" dir="${dir}" style="direction:${dir}"><div class="cn-h"><img class="cn-logo" src="${LOGO}"><div class="cn-hb"><div><div class="cn-ttl">${T.ttl}</div><div class="cn-sub">${T.sub}</div></div><div class="cn-pill">${pill}</div></div></div><div class="cn-pad">`;
    const cathTxt = c.cath ? ` · ${ar ? 'كاث لاب' : 'Cath Lab'} ${c.cath}` : '';
    h += `<div class="cn-k">
<div class="cn-kc" style="border-color:#0b5cab"><b style="color:#0b5cab">${L(c.total)}</b><strong>${T.tot}</strong><em>${T.cases}${c.reports !== c.total ? ' · ' + L(c.reports) + (ar ? ' بلاغ' : ' reports') : ''}</em></div>
<div class="cn-kc" style="border-color:#e0262f"><b style="color:#d9232e">${L(c.adm)}</b><strong>${T.adm}</strong><em>${T.rate} ${L(f1(c.rate) + '%')}${cathTxt}</em></div>
<div class="cn-kc" style="border-color:#b3121f"><b style="color:#b3121f">${L(c.intensive)}</b><strong>${T.icu}</strong><em>${L(c.icu + ' ICU + ' + c.picu + ' PICU')}</em></div>
<div class="cn-kc" style="border-color:#4a90d9"><b style="color:#4a90d9">${L(c.ward)}</b><strong>${T.ward}</strong><em>${T.wardS}</em></div></div>`;
    // sources
    const SK2 = c.src.other ? [...SK, 'other'] : SK;
    h += `<div class="cn-card"><div class="cn-t"><i></i>${T.bysrc}</div><div class="cn-s3" style="grid-template-columns:repeat(${SK2.length},1fr)">`;
    for (const k of SK2) {
      const n = c.src[k], a = c.asrc[k].n, w = c.total ? n * 100 / c.total : 0;
      h += `<div class="cn-sc" style="border-color:${COL[k]}"><div class="cn-sn"><i style="background:${COL[k]}"></i>${sn[k]}</div><div class="cn-sv" style="color:${COL[k]}">${L(n)}</div><div class="cn-bar"><span style="width:${w.toFixed(1)}%;background:${COL[k]}"></span></div><div class="cn-st">${L(pc(n))} · ${a ? T.admW + ' ' + L(a) : T.noadm}</div></div>`;
    }
    h += `</div>${c.carts ? `<div class="cn-note">${ar ? 'منها' : 'Of which'} ${L(c.carts)} ${ar ? 'حالة مصدرها عربات الساحات (محسوبة ضمن الفرقة الناقلة، دون ازدواج)' : 'case(s) originated from Courtyard Golf Carts (counted once, under the transporting team)'}</div>` : ''}${c.nosrc ? `<div class="cn-note">* ${L(c.nosrc)} ${T.nosrc}</div>` : ''}</div>`;
    // outcomes + admissions by source
    const notAdm = c.total - c.adm;
    const vals = [c.icu, c.picu, c.ward, c.cath, notAdm], cols = ['#b3121f', '#8e44ad', '#4a90d9', '#d6457f', '#c9d1dd'];
    const lab = [T.oIcu, T.oPicu, T.oWard, T.oCath, T.oNo];
    const leg = vals.map((v, i) => (i === 3 && !v ? '' : `<div><i style="background:${cols[i]}"></i>${lab[i]} ${L(v)}</div>`)).join('');
    h += `<div class="cn-g2"><div class="cn-card"><div class="cn-t"><i></i>${T.out}</div><div class="cn-dn"><div class="cn-dw"><img src="${seg(vals, cols)}"><div class="cn-dc"><b>${L(c.total)}</b><span>${T.cases}</span></div></div><div class="cn-lg">${leg}</div></div></div>`;
    let top = null; SK2.forEach((k) => { if (c.asrc[k].n > 0 && (!top || c.asrc[k].n > c.asrc[top].n)) top = k; });
    const ban = top ? `<div class="cn-ban" style="background:${COL[top]}">${sn[top]} – ${L(c.asrc[top].n)} ${T.cs} (${L(Math.round(c.asrc[top].n * 100 / c.adm) + '%')})</div>` : `<div class="cn-ban" style="background:#9aa5b6">${T.noAdm}</div>`;
    h += `<div class="cn-card"><div class="cn-t"><i></i>${T.adms}</div>${ban}<table class="cn-tb"><thead><tr><th>${T.src}</th><th>ICU</th><th>PICU</th><th>Ward</th>${c.cath ? '<th>Cath Lab</th>' : ''}<th>${T.sum}</th></tr></thead><tbody>`;
    for (const k of SK2) { const a = c.asrc[k]; h += `<tr><td>${ss[k]}</td><td>${L(a.icu)}</td><td>${L(a.picu)}</td><td>${L(a.ward)}</td>${c.cath ? `<td>${L(a.cath)}</td>` : ''}<td><b>${L(a.n)}</b></td></tr>`; }
    h += `</tbody></table>`;
    if (top) h += `<div class="cn-note">${T.arate(ss[top])}: <b style="color:#d9232e">${L(f1(c.asrc[top].n * 100 / (c.src[top] || 1)) + '%')}</b> (${L(c.asrc[top].n)} ${ar ? 'من' : 'of'} ${L(c.src[top])})</div>`;
    h += `</div></div>`;
    // comparison
    const days = D.days, B = D.base;
    const cur = { total: c.total / days, haram: c.src.haram / days, quba: c.src.quba / days, clinic: c.src.clinic / days, adm: c.adm / days, icu: c.intensive / days, rate: c.rate };
    const val = (k) => (mon ? cur[k] : { total: c.total, haram: c.src.haram, quba: c.src.quba, clinic: c.src.clinic, adm: c.adm, icu: c.intensive, rate: c.rate }[k]);
    const rows = [['total', T.mTot], ['haram', sn.haram], ['quba', sn.quba], ['clinic', sn.clinic], ['adm', T.mAdm], ['icu', T.mIcu], ['rate', T.mRate]];
    h += `<div class="cn-card"><div class="cn-t"><i></i>${T.cmp}</div><table class="cn-tb"><thead><tr><th>${T.metric}</th><th>${T.now}</th><th>${T.avg}</th><th>${T.diff}</th></tr></thead><tbody>`;
    for (const [k, nm] of rows) {
      const v = val(k), isR = k === 'rate', b = B ? B[k] : null;
      const vs = isR ? f1(v) + '%' : (mon ? f1(v) : String(v));
      let ds = '—', cl = 'cn-eq';
      if (b != null) { const d = Math.round((v - b) * 10) / 10; ds = (d > 0 ? '+' : d < 0 ? '-' : '') + f1(Math.abs(d)) + (isR ? 'pt' : ''); cl = d > 0 ? 'cn-up' : d < 0 ? 'cn-dnn' : 'cn-eq'; }
      h += `<tr><td>${nm}</td><td><b>${L(vs)}</b></td><td>${b != null ? L(isR ? f1(b) + '%' : f1(b)) : '—'}</td><td class="${cl}"><b>${L(ds)}</b></td></tr>`;
    }
    h += `</tbody></table>${mon ? `<div class="cn-note">${T.wk}: ${L(days)}</div>` : ''}</div>`;
    h += `<div class="cn-foot">${T.foot}</div></div></div>`;
    return h;
  }

  function loadH2C() {
    if (window.html2canvas) return Promise.resolve();
    const el = document.getElementById('h2c-src');
    if (!el) return Promise.reject(new Error('lib'));
    const s = document.createElement('script'); s.textContent = el.textContent; document.head.appendChild(s);
    return window.html2canvas ? Promise.resolve() : Promise.reject(new Error('lib'));
  }
  const b64bytes = (u) => { const b = atob(u.split(',')[1]), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  function makePdf(pages) {
    const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
    const push = (x) => { const u = typeof x === 'string' ? enc.encode(x) : x; parts.push(u); len += u.length; };
    const obj = (n, body) => { offs[n] = len; push(n + ' 0 obj\n' + body + '\nendobj\n'); };
    push('%PDF-1.4\n%âãÏÓ\n');
    const N = pages.length, PW = 595.28;
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Count ' + N + ' /Kids [' + pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] >>');
    pages.forEach((p, i) => {
      const PH = +(PW * p.h / p.w).toFixed(2), pg = 3 + 3 * i, ct = pg + 1, im = pg + 2;
      obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
      const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
      obj(ct, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
      offs[im] = len; push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`); push(p.jpg); push('\nendstream\nendobj\n');
    });
    const total = 3 + 3 * N, xr = len;
    let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
    for (let n = 1; n < total; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
    push(x + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');
    return new Blob(parts, { type: 'application/pdf' });
  }

  async function fetchStats(from, to) {
    const d = await api('GET', '/api/report?' + qs({ from, to }));
    return d.items;
  }
  async function build(kind, key) {
    // key: 'YYYY-MM-DD' (day) or 'YYYY-MM' (month)
    const y = +key.slice(0, 4), m = +key.slice(5, 7), d = kind === 'day' ? +key.slice(8, 10) : 0;
    const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y, pk = py + '-' + pad(pm);
    let from, to, days = 1;
    if (kind === 'day') { from = to = key; } else {
      from = key + '-01'; to = key + '-' + pad(dim(y, m));
      const t0 = todayStr(); days = t0.slice(0, 7) === key ? +t0.slice(8, 10) : dim(y, m);
      if (t0.slice(0, 7) < key) days = dim(y, m);
    }
    const items = (await fetchStats(from, to)).filter((c) => { const dd = localDay(c.created_at); return dd >= from && dd <= to; });
    let base = BASE[pk] || null;
    if (!base) {
      const pi = await fetchStats(pk + '-01', pk + '-' + pad(dim(py, pm)));
      if (pi.length) { const q = calc(pi), n = dim(py, pm); base = { total: q.total / n, haram: q.src.haram / n, quba: q.src.quba / n, clinic: q.src.clinic / n, adm: q.adm / n, icu: q.intensive / n, rate: q.rate }; }
    }
    return { kind: kind === 'day' ? 'day' : 'month', y, m, d, pm, days, base, cur: calc(items), wd: kind === 'day' ? new Date(Date.UTC(y, m - 1, d)).getUTCDay() : 0 };
  }
  async function generate(kind, key, btn) {
    const msg = btn.textContent; btn.disabled = true; btn.textContent = S.lang === 'ar' ? 'جاري إنشاء التقرير…' : 'Creating report…';
    const host = document.createElement('div');
    try {
      await loadH2C();
      const D = await build(kind, key);
      if (!document.getElementById('cn-css')) { const st = document.createElement('style'); st.id = 'cn-css'; st.textContent = css; document.head.appendChild(st); }
      host.style.cssText = 'position:fixed;left:-12000px;top:0;width:810px;pointer-events:none';
      document.body.appendChild(host);
      const pages = [], imgs = [];
      for (const lang of ['ar', 'en']) {
        host.innerHTML = pageHtml(lang, D);
        const el = host.firstChild;
        await Promise.all([...el.querySelectorAll('img')].map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }))));
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const cv = await window.html2canvas(el, { scale: 2, backgroundColor: '#eef2f8', logging: false, useCORS: true, width: 810, windowWidth: 810, scrollX: 0, scrollY: 0 });
        const u = cv.toDataURL('image/jpeg', 0.92);
        pages.push({ jpg: b64bytes(u), w: cv.width, h: cv.height }); imgs.push(u);
      }
      const blob = makePdf(pages);
      const name = (kind === 'day' ? 'EMS-Daily-Census-' : 'EMS-Monthly-Census-') + key + '.pdf';
      window.__lastCensus = { blob, name, D, imgs };
      showPreview(blob, name, imgs, kind, key);
    } catch (e) { toast(S.lang === 'ar' ? 'تعذّر إنشاء التقرير' : 'Could not create the report', 'err'); console.error(e); }
    finally { host.remove(); btn.disabled = false; btn.textContent = msg; }
  }
  function showPreview(blob, name, imgs, kind, key) {
    const ar = S.lang === 'ar';
    const m = openModal(esc(ar ? (kind === 'day' ? 'الإحصائية اليومية' : 'الإحصائية الشهرية') : (kind === 'day' ? 'Daily census' : 'Monthly census')) + ' ' + esc(key));
    const file = new File([blob], name, { type: 'application/pdf' });
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    m.body.innerHTML = `<div class="row" style="margin-bottom:12px"><button class="btn big" id="cnDl">⬇ ${ar ? 'تحميل PDF' : 'Download PDF'}</button>${canShare ? `<button class="btn big wa" id="cnSh">${ar ? 'مشاركة' : 'Share'}</button>` : ''}<button class="btn sec" data-act="closeModal">${esc(t('close'))}</button></div>${imgs.map((u) => `<img src="${u}" alt="" style="width:100%;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;display:block">`).join('')}`;
    $('#cnDl', m.body).onclick = async () => {
      try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; if (!dl) return toast(t('x_unavail'), 'err'); await dl.save({ filename: name, data: blob }); toast(t('x_saved'), 'ok'); }
      catch (e) { if (e && e.code === 'declined') toast(t('x_declined')); else toast(t('x_unavail'), 'err'); }
    };
    const sh = $('#cnSh', m.body); if (sh) sh.onclick = async () => { try { await navigator.share({ files: [file], title: name }); } catch (e) { if (!e || e.name !== 'AbortError') toast(t('share_fail'), 'err'); } };
  }
  function card(dailyOnly) {
    const ar = S.lang === 'ar';
    return `<div class="card" id="cen" style="margin-bottom:14px"><h2 style="margin-top:0">📄 ${dailyOnly ? (ar ? 'الإحصائية اليومية لنقل الحالات (PDF)' : 'Daily Transfer Census (PDF)') : (ar ? 'الإحصائية اليومية / الشهرية لنقل الحالات (PDF)' : 'Daily / Monthly Transfer Census (PDF)')}</h2>
<div class="row" style="align-items:flex-end;margin-bottom:10px"><div><label>${ar ? 'اليوم' : 'Day'}</label><input type="date" id="cnD" value="${todayStr()}"></div><button class="btn" id="cnDb">${ar ? 'إنشاء الإحصائية اليومية' : 'Create daily census'}</button></div>
${dailyOnly ? '' : `<div class="row" style="align-items:flex-end"><div><label>${ar ? 'الشهر' : 'Month'}</label><input type="month" id="cnM" value="${todayStr().slice(0, 7)}"></div><button class="btn sec" id="cnMb">${ar ? 'إنشاء الإحصائية الشهرية' : 'Create monthly census'}</button></div>`}</div>`;
  }
  return { card, generate, calc, build, pageHtml };
})();
VIEWS.census = async (main) => {
  main.innerHTML = `<h1>${esc(t('nav_census'))}</h1>` + CEN.card(true);
  const g = (id) => main.querySelector(id);
  g('#cnDb').onclick = () => { const v = g('#cnD').value; if (v) CEN.generate('day', v, g('#cnDb')); };
};
{
  const _vr = VIEWS.reports;
  VIEWS.reports = async (main) => {
    await _vr(main);
    const h1 = main.querySelector('h1'); if (!h1) return;
    h1.insertAdjacentHTML('afterend', CEN.card());
    const g = (id) => main.querySelector(id);
    g('#cnDb').onclick = () => { const v = g('#cnD').value; if (v) CEN.generate('day', v, g('#cnDb')); };
    g('#cnMb').onclick = () => { const v = g('#cnM').value; if (v) CEN.generate('month', v, g('#cnMb')); };
  };
}

  applyLang();
  try { const r = await api('GET', '/api/me'); S.user = r.user; } catch (_) { S.user = null; }
  start();
})();
})();
